<style>
/* Layout: a search-results page about one person. Main column = case studies as results; side column = knowledge panel with profile and contact. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13201D; --muted:#566560; --line:#DCE3E0;
  --accent:#0B6F57; --accent-soft:#E1F0EA; --link:#1D4FA8; --mark:#FBE3A0; --mark-ink:#13201D;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#151F1D; --ink:#E4ECE9; --muted:#9BABA5; --line:#27342F;
    --accent:#62C3A7; --accent-soft:#18302A; --link:#9BBCF6; --mark:#5A4614; --mark-ink:#F7E7B8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#151F1D; --ink:#E4ECE9; --muted:#9BABA5; --line:#27342F;
  --accent:#62C3A7; --accent-soft:#18302A; --link:#9BBCF6; --mark:#5A4614; --mark-ink:#F7E7B8; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;padding-block:14px 8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand b{color:var(--accent);font-weight:700}
.search{flex:1;min-width:0;max-width:620px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--bg);color:var(--ink)}
.search svg{flex:none;color:var(--muted)}
.search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;margin-inline-start:auto}
.lang button{font:500 13px var(--f-body);padding:6px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 12px 9px;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:680px){
  .top-row{flex-wrap:wrap;gap:12px}
  .search{order:3;flex-basis:100%;max-width:none}
}

/* page grid */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;padding-block:22px 64px;align-items:start}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px)}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);gap:24px}
  .panel{position:static;order:-1}
}
.count{font-size:13px;color:var(--muted);margin:0 0 16px}

/* featured snippet */
.featured{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.label{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.answer{font-size:17px;line-height:1.7;margin:0;max-width:65ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.kpi strong{display:block;font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:start}
.kpi span{display:block;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:4px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections */
.sec{padding-top:40px;scroll-margin-top:130px}
.sec>h2{font:600 22px/1.3 var(--f-display);margin:0;text-wrap:balance}
.sec>.sub{color:var(--muted);font-size:14px;margin:4px 0 4px}

/* result */
.result{padding-block:22px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:10px;min-width:0}
.fav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-display);flex:none}
.site{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.site b{font-weight:500;font-size:14px;color:var(--ink)}
.site span{font:12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate;text-align:start}
.result h3{margin:10px 0 4px;font:500 21px/1.35 var(--f-display);text-wrap:balance}
.result h3 a{color:var(--link);text-decoration:none}
.result h3 a:hover{text-decoration:underline}
.meta{font-size:13px;color:var(--muted);margin:0 0 8px}
.snippet{margin:0 0 12px;max-width:65ch}
mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:2px}
.did{margin:0 0 14px;padding-inline-start:20px;max-width:65ch}
.did li{margin-block:5px}
.did li::marker{color:var(--accent)}
.did code,.snippet code{font:13px var(--f-mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.sitelinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:4px 0 12px}
.sitelinks a{display:block;text-decoration:none;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.sitelinks a b{display:block;color:var(--link);font-weight:500;font-size:14.5px}
.sitelinks a:hover b{text-decoration:underline}
.sitelinks a span{display:block;font:12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate;text-align:start}
@media (max-width:560px){.sitelinks{grid-template-columns:minmax(0,1fr)}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:12px var(--f-mono);padding:3px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* compact results */
.mini{padding-block:16px;border-bottom:1px solid var(--line)}
.mini h4{margin:0;font:500 17px/1.4 var(--f-display);color:var(--ink)}
.mini .meta{margin:2px 0 6px}
.mini p{margin:0;max-width:65ch}
.mini .minilinks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px}
.mini .minilinks a{text-decoration:none}
.mini .minilinks a:hover{text-decoration:underline}

/* writing samples */
.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.sample{padding-block:14px;border-bottom:1px solid var(--line);min-width:0}
.sample .cat{font:12px var(--f-mono);color:var(--accent)}
.sample a{display:block;font:500 16px/1.5 var(--f-body);color:var(--link);text-decoration:none;margin-top:2px}
.sample a:hover{text-decoration:underline}
.sample .gloss{font-size:13px;color:var(--muted);margin:2px 0 0}
@media (max-width:640px){.samples{grid-template-columns:minmax(0,1fr)}}

/* people also ask */
.paa{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qa{padding:16px 20px;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa h4{margin:0 0 4px;font:500 16px/1.4 var(--f-display)}
.qa p{margin:0;color:var(--muted);max-width:65ch}

/* experience */
.timeline{margin:10px 0 0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding-block:12px;border-bottom:1px solid var(--line)}
.timeline .when{font:13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.timeline .what b{display:block;font-weight:600}
.timeline .what span{color:var(--muted);font-size:14px}
@media (max-width:560px){.timeline li{grid-template-columns:minmax(0,1fr);gap:2px}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px;margin-top:12px}
.skills h4{margin:0 0 8px;font:600 14px var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
@media (max-width:560px){.skills{grid-template-columns:minmax(0,1fr)}}
.certs{margin:10px 0 0;padding-inline-start:20px}
.certs li{margin-block:4px}

/* in-depth case studies */
.deep-case{padding-block:26px 30px;border-bottom:1px solid var(--line);scroll-margin-top:130px}
.deep-case .label{margin:0}
.deep-case h3{margin:6px 0 4px;font:600 24px/1.3 var(--f-display);text-wrap:balance}
.deep-case h4{margin:24px 0 6px;font:600 17px/1.4 var(--f-display)}
.deep-case p{margin:0 0 10px;max-width:65ch}
.deep-case .kpis{margin:14px 0 4px}
.deep-case ol,.deep-case ul{margin:0 0 10px;padding-inline-start:22px;max-width:65ch}
.deep-case li{margin-block:6px}
.deep-case li::marker{color:var(--accent)}
.shot{margin:16px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{font-size:13px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line)}
.shot.narrow{max-width:420px}
.tbl{overflow-x:auto;margin:8px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:600;font-size:12.5px;color:var(--muted)}
.tbl td.n{font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td.c{font:12.5px var(--f-mono);color:var(--muted)}
.bars{margin:10px 0 14px;display:grid;gap:8px;max-width:560px}
.bars .cap{font-size:13px;color:var(--muted);margin:0 0 2px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .v{font:13px var(--f-mono);text-align:end;direction:ltr}
.deep-link{display:inline-block;margin-top:10px;font-weight:500;text-decoration:none}
.deep-link:hover{text-decoration:underline}

/* knowledge panel */
.kp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kp-head{display:flex;gap:14px;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--line);flex:none;overflow:hidden}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.kp h1{margin:0;font:600 24px/1.2 var(--f-display)}
.kp .role{margin:3px 0 0;color:var(--muted);font-size:14px}
.kp-body{padding:16px 20px 18px}
.kp-desc{margin:0 0 14px;font-size:14.5px}
.facts{margin:0;display:grid;gap:7px;font-size:14px}
.facts div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.facts dt{font-weight:600}
.facts dd{margin:0;color:var(--muted)}
.kp h5{margin:16px 0 6px;font:600 13px var(--f-display);color:var(--muted)}
.contact{display:grid;gap:8px}
.crow{display:flex;align-items:center;gap:8px;min-width:0}
.crow .v{flex:1;min-width:0;font:13.5px var(--f-mono);user-select:all;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate;text-align:start}
.copy{flex:none;font:500 12px var(--f-body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{font-size:13.5px;font-weight:500;text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.links a.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.links a:hover{border-color:var(--accent)}

/* contact section */
.contact-band{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.cbox small{display:block;color:var(--muted);font-size:12.5px}
.cbox .v{display:block;font:14px var(--f-mono);margin-top:2px;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate;text-align:start}
.cbox a{text-decoration:none}
@media (max-width:640px){.contact-band{grid-template-columns:minmax(0,1fr)}}
footer{padding-block:20px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

function renderBlock(b){
  if (b.h) return `<h4>${esc(t(b.h))}</h4>`;
  if (b.p) return `<p>${rich(t(b.p))}</p>`;
  if (b.list) return `<ul>${t(b.list).map(x => `<li>${rich(x)}</li>`).join("")}</ul>`;
  if (b.steps) return `<ol>${t(b.steps).map(x => `<li>${esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</li>`).join("")}</ol>`;
  if (b.table) {
    const cell = (v, i) => `<td class="${i === 0 ? "" : /^[\d.,x+→ ]+$|^AED/.test(String(t(v))) ? "n" : "c"}">${esc(t(v))}</td>`;
    return `<div class="tbl"><table><thead><tr>${t(b.table.head).map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead>
      <tbody>${b.table.rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div>
      ${b.table.note ? `<p class="note">${esc(t(b.table.note))}</p>` : ""}`;
  }
  if (b.bars) {
    const max = Math.max(...b.bars.rows.map(r => r[1]));
    return `<div class="bars"><p class="cap">${esc(t(b.bars.cap))}</p>${b.bars.rows.map(r => `
      <div class="bar"><span>${esc(t(r[0]))}</span><span class="track"><span class="fill" style="display:block;width:${(r[1] / max * 100).toFixed(1)}%"></span></span><span class="v">${r[1].toFixed(1)}%</span></div>`).join("")}</div>`;
  }
  if (b.fig) {
    const f = b.fig;
    return `<figure class="shot${f.narrow ? " narrow" : ""}"><img src="${f.src}" width="${f.w}" height="${f.h}" alt="${esc(t(f.cap))}" loading="lazy"><figcaption>${esc(t(f.cap))}</figcaption></figure>`;
  }
  return "";
}

function renderPanel(){
  document.getElementById("kp").innerHTML = `
    <div class="kp-head">
      <div class="avatar"><img src="${PHOTO}" alt="${esc(t(PANEL.name))}" width="76" height="76"></div>
      <div><h1>${esc(t(PANEL.name))}</h1><p class="role">${esc(t(PANEL.role))}</p></div>
    </div>
    <div class="kp-body">
      <p class="kp-desc">${esc(t(PANEL.desc))}</p>
      <dl class="facts">${PANEL.facts.map(f => `<div><dt>${esc(t(f.k))}:</dt><dd>${esc(t(f.v))}</dd></div>`).join("")}</dl>
      <h5>${esc(t(PANEL.contactH))}</h5>
      <div class="contact">
        <div class="crow"><span class="v" id="c-email">${CONTACT.email}</span><button type="button" class="copy" id="copy-email" data-copy="${CONTACT.email}">${esc(t(UI.copy))}</button></div>
        <div class="crow"><span class="v" id="c-phone">${CONTACT.phone}</span><button type="button" class="copy" id="copy-phone" data-copy="${CONTACT.phone}">${esc(t(UI.copy))}</button></div>
      </div>
      <div class="links">
        <a class="primary" href="${CONTACT.whatsapp}" ${ext}>WhatsApp</a>
        <a href="${CONTACT.linkedin}" ${ext}>LinkedIn</a>
        <a href="https://almrj3.com/author/majd-salami/" ${ext}>${lang === "ar" ? "مقالاتي" : "Articles"}</a>
      </div>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  app.dir = lang === "ar" ? "rtl" : "ltr";
  app.lang = lang;
  document.documentElement.lang = lang;
  document.title = lang === "ar" ? "مجد سلامي | بورتفوليو" : "Majd Salami Portfolio";
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("btn-ar").setAttribute("aria-pressed", lang === "ar");
  renderStatic(); renderCases(); renderDeep(); renderSamples(); renderRest(); renderPanel();
}

function setLang(l){
  lang = l === "ar" ? "ar" : "en";
  try { localStorage.setItem("ms-lang", lang); } catch(e) {}
  render();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

document.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { b.textContent = t(UI.copied); setTimeout(() => { b.textContent = t(UI.copy); }, 1600); };
  const fallback = () => {
    const el = b.previousElementSibling;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch(err) { fallback(); }
});

document.addEventListener("click", e => {
  const a = e.target.closest(".tabs a");
  if (!a) return;
  document.querySelectorAll(".tabs a").forEach(x => x.classList.toggle("on", x === a));
});

(function init(){
  const h = (location.hash || "").replace("#","");
  let saved = null;
  try { saved = localStorage.getItem("ms-lang"); } catch(e) {}
  lang = h === "ar" ? "ar" : h === "en" ? "en" : (saved || "en");
  render();
})();
</script>

</body>
</html>
