      {p:{en:"Paid traffic only pays off if the store converts. Alongside the ads I worked on product pages, navigation, checkout and on-page SEO, and added bundles and cart cross-sells. Over 12 months the store took 4,552 orders with an average basket of AED 194 before delivery. Labneh is in 55% of orders, and 74% of customers bought only once, so retention and bundles are the next lever.",ar:"الزيارات المدفوعة لا تربح إلا إذا كان المتجر يحوّل. إلى جانب الإعلانات عملت على صفحات المنتجات والتنقل وخطوات الدفع والسيو الداخلي، وأضفت الباقات والاقتراحات في السلة. خلال 12 شهرًا استقبل المتجر 4,552 طلبًا بمتوسط سلة 194 درهمًا قبل التوصيل. اللبنة موجودة في 55% من الطلبات، و74% من العملاء اشتروا مرة واحدة فقط، لذلك فإن الاحتفاظ بالعملاء والباقات هما الخطوة التالية."}},
      {bars:{
        cap:{en:"Share of tracked store revenue by channel, GA4, Jun 2025 – Oct 2026",ar:"حصة كل قناة من إيرادات المتجر المتتبَّعة، GA4، يونيو 2025 – أكتوبر 2026"},
        rows:[[{en:"Paid social",ar:"السوشال المدفوع"},36.9],[{en:"Direct",ar:"مباشر"},22.1],[{en:"Organic social",ar:"السوشال العضوي"},22.0],[{en:"Organic search",ar:"البحث العضوي"},17.7],[{en:"Other",ar:"أخرى"},1.3]]
      }},
      {fig:{src:"img/uh-before.jpg",w:1400,h:248,cap:{en:"March 2025, archived by the Wayback Machine: English only, with a short menu.",ar:"مارس 2025 من أرشيف Wayback Machine: باللغة الإنجليزية فقط وبقائمة قصيرة."}}},
      {fig:{src:"img/uh-after.jpg",w:1400,h:366,cap:{en:"October 2026: Arabic version, new categories such as Frozen Foods, and a keyword-led H1.",ar:"أكتوبر 2026: نسخة عربية، وفئات جديدة مثل المجمدات، وعنوان H1 مبني على الكلمات المفتاحية."}}},
      {h:{en:"Social content",ar:"محتوى السوشال ميديا"}},
      {p:{en:"I plan and publish content for Instagram (55.6K followers), Facebook, TikTok and Snapchat: human stories, occasions, launches and product guides. The organic Instagram link brought 21% of site orders in 19–30 Oct. Full numbers are in the Reels section above.",ar:"أخطط وأنشر المحتوى على إنستغرام (55.6 ألف متابع) وفيسبوك وتيك توك وسناب شات: القصص الإنسانية، والمناسبات، والإطلاقات، وأدلة المنتجات. رابط إنستغرام العضوي جلب 21% من طلبات الموقع في 19–30 أكتوبر. الأرقام الكاملة في قسم الريلز أعلاه."}},
      {fig:{src:"img/uh-instagram-grid.jpg",w:1126,h:632,cap:{en:"Recent Instagram posts: product guides, offers and the Global Village shop launch.",ar:"منشورات حديثة على إنستغرام: أدلة المنتجات والعروض وافتتاح محل القرية العالمية."}}}

  {
    id:"am-case",
    eyebrow:{en:"Content studio · Channel launch",ar:"استوديو محتوى · إطلاق قناة"},
    title:{en:"Alat Mansiya: launching an Arabic documentary channel from zero with an AI-assisted studio",ar:"آلات منسية: إطلاق قناة وثائقية عربية من الصفر باستوديو يعمل بالذكاء الاصطناعي"},
    meta:{en:"youtube.com/@AlatMansiya · Launched 20 Nov 2026 · Data: YouTube Studio and Meta Business Suite, read 26 Nov 2026",ar:"youtube.com/@AlatMansiya · انطلقت 20 نوفمبر 2026 · البيانات: YouTube Studio وMeta Business Suite، قراءة 26 نوفمبر 2026"},
    kpis:[
      {n:"24K",en:"Facebook views on one Short in its first week",ar:"مشاهدة على فيسبوك لـShort واحد في أسبوعه الأول"},
      {n:"22.9K",en:"Facebook views on another (17.1K people)",ar:"مشاهدة على فيسبوك لآخر (17.1 ألف شخص)"},
      {n:"45.6%",en:"average watch of the 12-minute first episode",ar:"متوسط مشاهدة الحلقة الأولى ذات الـ12 دقيقة"},
      {n:"68%",en:"viewed-through rate of the best Short on YouTube",ar:"نسبة إكمال أفضل Short على يوتيوب"}
    ],
    blocks:[
      {h:{en:"The idea",ar:"الفكرة"}},
      {p:{en:"Arabic documentaries about machines that came before their time and then disappeared: supersonic jets, airships, flying aircraft carriers, ground-effect ships. Each long episode is cut into Shorts with a one-line hook, then adapted for Facebook, Instagram and TikTok.",ar:"وثائقيات عربية عن آلات سبقت عصرها ثم اختفت: طائرات أسرع من الصوت، ومناطيد، وحاملات طائرات طائرة، وسفن تطير فوق الماء. كل حلقة طويلة تُقطَّع إلى Shorts بافتتاحية من سطر واحد، ثم تُكيَّف لفيسبوك وإنستغرام وتيك توك."}},
      {h:{en:"How one person produces at team volume",ar:"كيف ينتج شخص واحد بحجم فريق"}},
      {steps:{
        en:[
          "**Scene sheet first.** I write and approve the episode's scenes, hooks and on-screen lines before anything is rendered or paid for.",
          "**Sourced facts.** Every claim is listed with its source, and a separate AI fact-checker reviews the script.",
          "**Visuals.** Code animation (Motion Canvas, Manim, three.js, GSAP), archive photos, and generated reconstruction shots that carry an on-screen «إعادة بناء بصرية» (visual reconstruction) label.",
          "**Voice and checks.** An AI narration voice, with a Whisper transcript check against the script, and a free virality pre-check on every Short before it goes out.",
          "**Cost.** About 174 generation credits for the whole first episode: a 12-minute documentary plus its Shorts."
        ],
        ar:[
          "**جدول المشاهد أولًا.** أكتب مشاهد الحلقة وافتتاحياتها ونصوصها على الشاشة وأعتمدها قبل أي تصيير أو صرف.",
          "**معلومات موثّقة.** كل معلومة مكتوبة مع مصدرها، ومدقق حقائق آلي منفصل يراجع النص.",
          "**الصورة.** رسوم متحركة بالكود (Motion Canvas وManim وthree.js وGSAP)، وصور أرشيفية، ولقطات إعادة بناء مولّدة تحمل على الشاشة عبارة «إعادة بناء بصرية».",
          "**الصوت والفحص.** تعليق صوتي بالذكاء الاصطناعي، مع مطابقة نص Whisper بالنص المكتوب، وفحص مجاني لتوقّع الانتشار لكل Short قبل نشره.",
          "**التكلفة.** نحو 174 رصيد توليد للحلقة الأولى كاملة: وثائقي من 12 دقيقة مع مقاطعه القصيرة."
        ]
      }},
      {h:{en:"First-week results",ar:"نتائج الأسبوع الأول"}},
      {table:{
        head:{en:["Video","YouTube views","Facebook views","Note"],ar:["الفيديو","مشاهدات يوتيوب","مشاهدات فيسبوك","ملاحظة"]},
        rows:[
          [{en:"Short: the first plane with a broken nose",ar:"Short: أول طائرة بأنف مكسور"},"2,009","22,898",{en:"68% viewed on YouTube",ar:"68% إكمال على يوتيوب"}],
          [{en:"Short: a plane that grows 25 cm in flight",ar:"Short: طائرة تتمدد 25 سم في الجو"},"1,357","24,000",{en:"best Facebook reach",ar:"أفضل وصول على فيسبوك"}],
          [{en:"Episode 1: Concorde (12:20)",ar:"الحلقة 1: الكونكورد (12:20)"},"545","—",{en:"45.6% average watch, 3.7% CTR",ar:"45.6% متوسط مشاهدة، 3.7% نسبة نقر"}]
        ],
        note:{en:"YouTube Studio and Meta Business Suite, 20–26 Nov 2026. TikTok drew 99–140 views per video in the same week.",ar:"YouTube Studio وMeta Business Suite، 20–26 نوفمبر 2026. تيك توك جلب 99–140 مشاهدة لكل فيديو في الأسبوع نفسه."}
      }},
      {h:{en:"What the first week taught me",ar:"ما علّمني إياه الأسبوع الأول"}},
      {list:{
        en:[
          "Facebook is the reach engine for this audience: the same Short got about 10× more views there than on YouTube.",
          "People watch, but too few click: 45.6% average watch is strong, 3.7% click-through is weak. So episode 2 went out on 27 Nov with a three-way title and thumbnail test.",
          "The «impossible machine» angle wins. Any Short that passes 10K views gets a part two."
        ],
        ar:[
          "فيسبوك هو محرك الوصول لهذا الجمهور: الـShort نفسه حصد هناك نحو 10 أضعاف مشاهداته على يوتيوب.",
          "الناس يشاهدون لكن القليل ينقر: متوسط المشاهدة 45.6% قوي، ونسبة النقر 3.7% ضعيفة. لذلك نُشرت الحلقة الثانية يوم 27 نوفمبر مع اختبار ثلاثي للعنوان والصورة المصغّرة.",
          "زاوية «الآلة المستحيلة» هي الرابحة. أي Short يتجاوز 10 آلاف مشاهدة يحصل على جزء ثانٍ."
        ]
      }},
      {p:{en:"The same studio produces Um Hamza's organic reels. There, AI handles the edit and the presenter voice, while real footage, real hands and my hooks keep it honest; paid ads use real footage, because it sells better.",ar:"الاستوديو نفسه ينتج ريلز أم حمزة العضوية. هناك يتولى الذكاء الاصطناعي المونتاج وصوت المقدّمة، بينما تحافظ اللقطات الحقيقية والأيدي الحقيقية وافتتاحياتي على المصداقية؛ أما الإعلانات المدفوعة فتعتمد اللقطات الحقيقية لأنها تبيع أكثر."}}
    ]

  {
    id:"oz-case",
    eyebrow:{en:"SEO · Service page and articles",ar:"سيو · صفحة خدمة ومقالات"},
    title:{en:"OZONE: getting a Dubai web design service found in UAE search",ar:"أوزون: إظهار خدمة تصميم المواقع في بحث Google بالإمارات"},
    meta:{en:"ozs.ae · Apr – Oct 2026 · Sources: Google Search Console, GA4, Google UAE results",ar:"ozs.ae · أبريل – أكتوبر 2026 · المصادر: Google Search Console وGA4 ونتائج Google في الإمارات"},
    kpis:[
      {n:"+64%",en:"organic clicks, last 3 months vs the 3 before",ar:"نقرات عضوية، آخر 3 أشهر مقابل الـ3 السابقة"},
      {n:"+76%",en:"organic clicks from the UAE (140 → 247)",ar:"نقرات عضوية من الإمارات (140 ← 247)"},
      {n:"2 → 18",en:"clicks on web design keywords",ar:"نقرة على كلمات تصميم المواقع"},
      {n:"71%",en:"of site conversions came from organic search",ar:"من تحويلات الموقع جاءت من البحث العضوي"}
    ],
    blocks:[
      {h:{en:"The goal",ar:"الهدف"}},
      {p:{en:"OZONE Digital Solutions is a Dubai software company founded in 2004. The goal: when a business in the UAE searches for a web design company, in Arabic or English, OZONE should appear on the first page.",ar:"أوزون للحلول الرقمية شركة برمجيات في دبي تأسست عام 2004. الهدف: عندما تبحث شركة في الإمارات عن شركة تصميم مواقع، بالعربية أو الإنجليزية، تظهر أوزون في الصفحة الأولى."}},
      {h:{en:"What we worked on",ar:"ما عملنا عليه"}},
      {steps:{
        en:[
          "**Service page rebuilt around search intent.** The English and Arabic web development pages put \"Dubai and the UAE\" in the title and H1, and answer buyer questions in 10 sections: what the service is, who needs it, website types, process, cost factors and FAQ.",
          "**Structured data.** Service, Organization, location details, BreadcrumbList and FAQPage on the service pages, and BlogPosting on articles. Search Console reports valid breadcrumbs on 74 pages.",
          "**Supporting articles.** Arabic articles cover city and intent variations (Dubai, the UAE, medical websites, Jeddah, a 2026 buyer's guide), and each links back to the service page.",
          "**Local targeting.** Dubai and the UAE added to titles, headings and copy, with hreflang linking the Arabic and English versions."
        ],
        ar:[
          "**إعادة بناء صفحة الخدمة حول نية البحث.** صفحتا تطوير المواقع بالعربية والإنجليزية تضعان «دبي والإمارات» في العنوان وH1، وتجيبان عن أسئلة العميل في 10 أقسام: تعريف الخدمة، ومن يحتاجها، وأنواع المواقع، وخطوات العمل، وما يحدد التكلفة، والأسئلة الشائعة.",
          "**البيانات المنظمة (Schema).** Service وOrganization وبيانات الموقع الجغرافي وBreadcrumbList وFAQPage في صفحات الخدمة، وBlogPosting في المقالات. يظهر في Search Console مسار تنقل صالح في 74 صفحة.",
          "**مقالات داعمة.** مقالات عربية تغطي المدن ونوايا البحث (دبي، الإمارات، المواقع الطبية، جدة، ودليل اختيار 2026)، وكل مقال يربط بصفحة الخدمة.",
          "**الاستهداف المحلي.** إضافة دبي والإمارات إلى العناوين والعناوين الفرعية والنصوص، مع وسم hreflang يربط النسختين العربية والإنجليزية."
        ]
      }},
      {fig:{src:"img/oz-service-page.jpg",w:1400,h:412,cap:{en:"The English service page: the title and H1 target Dubai and the UAE.",ar:"صفحة الخدمة بالإنجليزية: العنوان وH1 يستهدفان دبي والإمارات."}}},
      {h:{en:"Opportunities found in Search Console",ar:"الفرص المكتشفة في Search Console"}},
      {p:{en:"Keywords already sitting on pages 1–2 get the next round of work, because a few positions there move traffic the most.",ar:"الكلمات الموجودة أصلًا في الصفحتين الأولى والثانية هي أولوية العمل التالية، لأن التقدم بضعة مراكز فيها يحرّك الزيارات أكثر من غيرها."}},
      {table:{
        head:{en:["Keyword (Arabic)","Avg. position","Impressions"],ar:["الكلمة المفتاحية","متوسط الترتيب","مرات الظهور"]},
        rows:[
          ["شركة تصميم مواقع دبي","9.4","1,069"],
          ["شركة تصميم مواقع في دبي","13.1","464"],
          ["افضل شركة تصميم مواقع في الامارات","13.8","245"],
          ["شركات تصميم مواقع","16.4","236"],
          ["شركة تصميم مواقع","26.0","874"],
          ["تصميم مواقع طبية","3.0","97"]
        ],
        note:{en:"Google Search Console, 27 Jul – 25 Oct 2026.",ar:"Google Search Console، 27 يوليو – 25 أكتوبر 2026."}
      }},
      {fig:{src:"img/oz-sc-webdesign.jpg",w:1284,h:430,cap:{en:"Search Console filtered to web design keywords (تصميم مواقع), 27 Jul – 25 Oct 2026: 18 clicks and 9.8K impressions, up from 2 clicks in the previous 3 months.",ar:"Search Console مفلترًا على كلمات «تصميم مواقع»، 27 يوليو – 25 أكتوبر 2026: 18 نقرة و9.8 ألف ظهور، مقابل نقرتين في الأشهر الثلاثة السابقة."}}},
      {h:{en:"Competitor gap",ar:"الفجوة مع المنافسين"}},
      {p:{en:"On Google UAE for شركة تصميم مواقع دبي, the leading results are upbeat.digital, canadahitech.com and uaepd.net, with OZONE's 2026 buyer's guide right after them. Two gaps stand out: competitors hold the map pack through Google Business Profiles with reviews, and some show review stars in results.",ar:"في Google الإمارات لعبارة «شركة تصميم مواقع دبي» تتصدر النتائج upbeat.digital وcanadahitech.com وuaepd.net، ويأتي دليل أوزون لاختيار شركة تصميم المواقع 2026 بعدها مباشرة. تظهر فجوتان: المنافسون يسيطرون على نتائج الخريطة عبر ملفات Google Business مع تقييمات، وبعضهم تظهر له نجوم التقييم في النتائج."}},
      {fig:{src:"img/oz-serp.jpg",w:556,h:590,narrow:true,cap:{en:"Google UAE, 28 Oct 2026. The Search Console panel shows an 8.2 average position over the last 7 days.",ar:"Google الإمارات، 28 أكتوبر 2026. لوحة Search Console تظهر متوسط ترتيب 8.2 خلال آخر 7 أيام."}}},
      {h:{en:"Results",ar:"النتائج"}},
      {fig:{src:"img/oz-sc-uae.jpg",w:1284,h:392,cap:{en:"Search Console, UAE only, 27 Jul – 25 Oct 2026: 247 clicks, up from 140 in the previous 3 months.",ar:"Search Console للإمارات فقط، 27 يوليو – 25 أكتوبر 2026: 247 نقرة مقابل 140 في الأشهر الثلاثة السابقة."}}},
      {fig:{src:"img/oz-ga4.jpg",w:1234,h:616,cap:{en:"GA4 traffic acquisition, 27 Jul – 25 Oct 2026: organic search brought 1,231 sessions and 80 of the site's 112 key events.",ar:"GA4، مصادر الزيارات، 27 يوليو – 25 أكتوبر 2026: البحث العضوي جلب 1,231 جلسة و80 من أصل 112 تحويلًا."}}},
      {h:{en:"Next phase: moving the site without losing rankings",ar:"المرحلة التالية: نقل الموقع دون خسارة الترتيب"}},
      {p:{en:"In November 2026 I planned the move from WordPress to a new site: 255 pages and items inventoried, 1,103 redirect rules, 4,514 internal links rewritten and 71 English URLs unified. It hasn't launched yet, so this is planning, not a result.",ar:"في نوفمبر 2026 خطّطت لنقل الموقع من ووردبريس إلى موقع جديد: جرد 255 صفحة وعنصرًا، و1,103 قواعد تحويل، وإعادة كتابة 4,514 رابطًا داخليًا، وتوحيد 71 رابطًا إنجليزيًا. لم يُطلق بعد، لذلك هذا تخطيط وليس نتيجة."}},
      {h:{en:"Next steps",ar:"الخطوات التالية"}},
      {list:{
        en:[
          "Fix keyword cannibalization: at least five Arabic URLs compete for \"website design company Dubai\". Merge them into one hub page and redirect the rest.",
          "Grow the English service page. It started earning impressions in August 2026 and still averages position 45.",
          "Build the Google Business Profile and collect reviews to compete for the map pack."
        ],
        ar:[
          "معالجة تضارب الكلمات المفتاحية: خمسة روابط عربية على الأقل تتنافس على «شركة تصميم مواقع دبي». دمجها في صفحة محورية واحدة وتحويل الباقي إليها.",
          "تقوية صفحة الخدمة الإنجليزية، فقد بدأت تظهر في أغسطس 2026 ومتوسط ترتيبها ما زال 45.",
          "بناء ملف Google Business وجمع التقييمات للمنافسة في نتائج الخريطة."
        ]
      }}
    ]

let lang = "en";
const t = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.en) : v;

const ext = 'target="_blank" rel="noopener"';

}

      <div class="sitelinks">${c.links.filter(l => l.url).map(l => `<a href="${l.url}" ${ext}><b>${esc(t(l))}</b><span>${esc(l.url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))}</span></a>`).join("")}</div>
      ${c.deep ? `<a class="deep-link" href="#${c.deep}">${esc(t(UI.readCase))}</a>` : ""}
    </article>`).join("");
  document.getElementById("howto").innerHTML = t(HOWTO).map(x => `<li><span>${esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</span></li>`).join("");
  document.getElementById("vtools").innerHTML = VTOOLS.map(x => `<span>${esc(x)}</span>`).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest(".yt-play");
  if (!b) return;
  const f = document.createElement("iframe");
  f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&playsinline=1&rel=0`;
  f.title = b.getAttribute("aria-label");
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  b.parentElement.replaceChildren(f);
});

function renderSamples(){
  document.getElementById("samples").innerHTML = SAMPLES.map(s => `
    <div class="sample">
      <span class="cat"><span class="ltr">${esc(s.site)}</span> › ${esc(t(s.cat))}</span>
      <a href="${s.url}" ${ext} lang="ar" dir="rtl">${esc(s.t)}</a>
      ${lang === "en" ? `<p class="gloss">${esc(s.g)}</p>` : ""}
    </div>`).join("");
}

function renderBlock(b){
  if (b.h) return `<h4>${esc(t(b.h))}</h4>`;
  if (b.p) return `<p>${rich(t(b.p))}</p>`;
  if (b.list) return `<ul>${t(b.list).map(x => `<li>${rich(x)}</li>`).join("")}</ul>`;
  if (b.steps) return `<ol>${t(b.steps).map(x => `<li>${esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</li>`).join("")}</ol>`;
  if (b.table) {
    const cell = (v, i) => `<td class="${i === 0 ? "" : /^[\d.,x+→ ]+$|^AED/.test(String(t(v))) ? "n" : "c"}">${esc(t(v))}</td>`;
    return `<div class="tbl"><table><thead><tr>${t(b.table.head).map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead>
      <tbody>${b.table.rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div>
      ${b.table.note ? `<p class="note">${esc(t(b.table.note))}</p>` : ""}`;
  }
  if (b.bars) {
    const max = Math.max(...b.bars.rows.map(r => r[1]));
    return `<div class="bars"><p class="cap">${esc(t(b.bars.cap))}</p>${b.bars.rows.map(r => `
      <div class="bar"><span>${esc(t(r[0]))}</span><span class="track"><span class="fill" style="display:block;width:${(r[1] / max * 100).toFixed(1)}%"></span></span><span class="v">${r[1].toFixed(1)}%</span></div>`).join("")}</div>`;
  }
  if (b.fig) {
    const f = b.fig;
    return `<figure class="shot${f.narrow ? " narrow" : ""}"><img src="${f.src}" width="${f.w}" height="${f.h}" alt="${esc(t(f.cap))}" loading="lazy"><figcaption>${esc(t(f.cap))}</figcaption></figure>`;
  }
  return "";
}

function renderDeep(){
  document.getElementById("deepCases").innerHTML = DEEP.map(c => `
    <article class="deep-case" id="${c.id}">
      <p class="label">${esc(t(c.eyebrow))}</p>
      <h3>${esc(t(c.title))}</h3>
      <p class="meta">${esc(t(c.meta))}</p>
      <div class="kpis">${c.kpis.map(k => `<div class="kpi"><strong>${esc(k.n)}</strong><span>${esc(t(k))}</span></div>`).join("")}</div>
      ${c.blocks.map(renderBlock).join("")}
    </article>`).join("");
}

function renderRest(){
  document.getElementById("earlierList").innerHTML = EARLIER.map(e => `
    <div class="mini"><h4>${esc(e.name)}</h4><p class="meta">${esc(t(e.meta))}</p><p>${esc(t(e.text))}</p>${e.links ? `<p class="minilinks">${e.links.map(l => `<a href="${l.url}" ${ext}>${esc(t(l))}</a>`).join("")}</p>` : ""}${e.deep ? `<a class="deep-link" href="#${e.deep}">${esc(t(UI.readCase))}</a>` : ""}</div>`).join("");
  document.getElementById("paa").innerHTML = PAA.map(p => `
    <div class="qa"><h4>${esc(t(p.q))}</h4><p>${esc(t(p.a))}</p></div>`).join("");
  document.getElementById("timeline").innerHTML = TIMELINE.map(x => `
    <li><span class="when">${esc(t(x.when))}</span><span class="what"><b class="ltr">${esc(x.role)}</b><span>${esc(t(x.org))}</span></span></li>`).join("");
  document.getElementById("skillGroups").innerHTML = SKILLS.map(g => `
    <div><h4>${esc(t(g.h))}</h4><div class="chips">${g.items.map(i => `<span>${esc(t(i))}</span>`).join("")}</div></div>`).join("");
  document.getElementById("certs").innerHTML = CERTS.map(c => `<li>${esc(t(c))}</li>`).join("");
  document.getElementById("contactBand").innerHTML = `
    <div class="cbox"><small>${esc(t(PANEL.emailL))}</small><span class="v">${CONTACT.email}</span></div>
    <div class="cbox"><small>${esc(t(PANEL.phoneL))}</small><a class="v" href="${CONTACT.whatsapp}" ${ext}>${CONTACT.phone}</a></div>
    <div class="cbox"><small>LinkedIn</small><a class="v" href="${CONTACT.linkedin}" ${ext}>${lang === "ar" ? "مجد سلامي على لينكدإن" : "Majd Salami on LinkedIn"}</a></div>`;
}

function renderPanel(){
  document.getElementById("kp").innerHTML = `
    <div class="kp-head">
      <div class="avatar"><img src="${PHOTO}" alt="${esc(t(PANEL.name))}" width="76" height="76"></div>
      <div><h1>${esc(t(PANEL.name))}</h1><p class="role">${esc(t(PANEL.role))}</p></div>
    </div>
    <div class="kp-body">
      <p class="kp-desc">${esc(t(PANEL.desc))}</p>
      <dl class="facts">${PANEL.facts.map(f => `<div><dt>${esc(t(f.k))}:</dt><dd>${esc(t(f.v))}</dd></div>`).join("")}</dl>
      <h5>${esc(t(PANEL.contactH))}</h5>
      <div class="contact">
        <div class="crow"><span class="v" id="c-email">${CONTACT.email}</span><button type="button" class="copy" id="copy-email" data-copy="${CONTACT.email}">${esc(t(UI.copy))}</button></div>
        <div class="crow"><span class="v" id="c-phone">${CONTACT.phone}</span><button type="button" class="copy" id="copy-phone" data-copy="${CONTACT.phone}">${esc(t(UI.copy))}</button></div>
      </div>
      <div class="links">
        <a class="primary" href="${CONTACT.whatsapp}" ${ext}>WhatsApp</a>
        <a href="${CONTACT.linkedin}" ${ext}>LinkedIn</a>
        <a href="https://almrj3.com/author/majd-salami/" ${ext}>${lang === "ar" ? "مقالاتي" : "Articles"}</a>
      </div>
    </div>`;
}

function render(){
  const app = document.getElementById("app");
  app.dir = lang === "ar" ? "rtl" : "ltr";
  app.lang = lang;
  document.documentElement.lang = lang;
  document.title = lang === "ar" ? "مجد سلامي | إعلانات Meta والسيو والريلز للعلامات في الإمارات" : "Majd Salami | Meta Ads, SEO & Reels for UAE Brands · Dubai";
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("btn-ar").setAttribute("aria-pressed", lang === "ar");
  renderStatic(); renderServices(); renderReels(); renderCases(); renderDeep(); renderSamples(); renderRest(); renderPanel();
}

function setLang(l){
  lang = l === "ar" ? "ar" : "en";
  try { localStorage.setItem("ms-lang", lang); } catch(e) {}
  render();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

document.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { b.textContent = t(UI.copied); setTimeout(() => { b.textContent = t(UI.copy); }, 1600); };
  const fallback = () => {
    const el = b.previousElementSibling;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch(err) { fallback(); }
});

document.addEventListener("click", e => {
  const a = e.target.closest(".tabs a");
  if (!a) return;
  document.querySelectorAll(".tabs a").forEach(x => x.classList.toggle("on", x === a));
});

(function init(){
  const h = (location.hash || "").replace("#","");
  let saved = null;
  try { saved = localStorage.getItem("ms-lang"); } catch(e) {}
  lang = h === "ar" ? "ar" : h === "en" ? "en" : (saved || "en");
  render();
})();
</script>

</body>
</html>
